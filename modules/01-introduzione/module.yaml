id: introduzione
title: Introduzione a RPG
description: Che cos'è RPG, da dove viene e in quale ambiente vivono i suoi programmi.
objectives:
  - Descrivere a che cosa serve RPG e dove si usa oggi
  - Collocare RPG IV e il formato libero nella storia del linguaggio
  - Orientarsi tra oggetti, librerie e file sorgente di IBM i
  - Compilare ed eseguire un programma RPG
